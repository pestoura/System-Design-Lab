<!DOCTYPE html>
<html lang="en">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<meta name="description" content="Interactive laboratory for System Design, Distributed Systems, Security Architecture, DevSecOps and cybersecurity simulations.">

<meta property="og:description" content="Interactive System Design and Security Architecture Laboratory.">

<script type="application/ld+json">{"@context":"https://schema.org","@type":"WebSite","name":"System Design Lab","author":{"@type":"Person","name":"Pedro Estoura","url":"https://github.com/pestoura"}}</script>
<meta name="theme-color" content="#0B0D10">
<style>
html,body{margin:0;background:#0B0D10;color:#F5F7FA;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;min-height:100%}
#boot{position:fixed;inset:0;display:grid;place-items:center;background:#0B0D10;color:#B1BAC4;z-index:999999}
.boot-card{width:min(520px,calc(100vw - 48px));padding:32px;border:1px solid rgba(255,255,255,.09);border-radius:18px;background:#12161B;box-shadow:0 24px 80px rgba(0,0,0,.35)}
.boot-title{font-size:24px;font-weight:800;color:#F5F7FA;margin-bottom:8px}.boot-accent{color:#FFB000}.boot-sub{font-size:13px;line-height:1.6}.boot-bar{height:3px;margin-top:20px;background:#1A2027;border-radius:2px;overflow:hidden}.boot-bar:after{content:"";display:block;height:100%;width:38%;background:linear-gradient(90deg,#FFB000,#4EA1FF);animation:load 1.1s ease-in-out infinite}@keyframes load{0%{transform:translateX(-120%)}100%{transform:translateX(360%)}}
</style>
</head>
<body>
<div id="boot"><div class="boot-card"><div class="boot-title">System Design <span class="boot-accent">Lab</span></div><div class="boot-sub" id="boot-status">Loading interactive system and security architecture laboratory…</div><div class="boot-bar"></div></div></div>
<script>
(async function(){
  const status=document.getElementById('boot-status');
  const palette=[
    [/#060913/gi,'#0B0D10'],[/#0c1120/gi,'#12161B'],[/#111827/gi,'#1A2027'],[/#0a0f1e/gi,'#0E1216'],
    [/#0d1424/gi,'#111820'],[/#050c18/gi,'#090C10'],[/#030810/gi,'#07090C'],[/#0a1628/gi,'#1A2027'],[/#0d1e38/gi,'#242C35'],
    [/#00e5ff/gi,'#FFB000'],[/#00b4d8/gi,'#D98F00'],[/#ffa500/gi,'#FF7A00'],[/#00ff88/gi,'#42D392'],
    [/#ff4757/gi,'#FF5C70'],[/#a855f7/gi,'#4EA1FF'],[/#ec4899/gi,'#F06292'],[/#e8eaf6/gi,'#F5F7FA'],
    [/#9ca3af/gi,'#B1BAC4'],[/#6b7280/gi,'#6F7A86'],[/#82aaff/gi,'#7DB7FF'],[/#82ffdb/gi,'#6EE7B7'],
    [/#f78c6c/gi,'#FF9A62'],[/#546e7a/gi,'#71808F'],
    [/rgba\(0,229,255,/g,'rgba(255,176,0,'],[/rgba\(0,180,216,/g,'rgba(217,143,0,'],
    [/rgba\(255,165,0,/g,'rgba(255,122,0,'],[/rgba\(0,255,136,/g,'rgba(66,211,146,'],
    [/rgba\(255,71,87,/g,'rgba(255,92,112,'],[/rgba\(168,85,247,/g,'rgba(78,161,255,'],
    [/rgba\(236,72,153,/g,'rgba(240,98,146,'],[/rgba\(6,9,19,/g,'rgba(11,13,16,'],[/rgba\(12,17,32,/g,'rgba(18,22,27,'],
    [/0x00e5ff/gi,'0xFFB000'],[/0x00b4d8/gi,'0xD98F00'],[/0xffa500/gi,'0xFF7A00'],[/0x00ff88/gi,'0x42D392'],
    [/0xff4757/gi,'0xFF5C70'],[/0xa855f7/gi,'0x4EA1FF'],[/0xec4899/gi,'0xF06292'],[/0x060913/gi,'0x0B0D10'],
    [/0x0a1628/gi,'0x1A2027'],[/0x0d1e38/gi,'0x242C35']
  ];
  try{
    if(status)status.textContent='Loading application core…';
    const response=await fetch('./runtime/core.payload',{cache:'no-store'});
    if(!response.ok)throw new Error('Application core returned HTTP '+response.status);
    let html=await response.text();
    if(!html.includes('<!DOCTYPE html>'))throw new Error('Application core is not valid HTML');
    if(status)status.textContent='Sanitizing application core…';
    html=html.replace(/<svg\b[^>]*\bwidth=["']0["'][^>]*\bheight=["']0["'][^>]*>[\s\S]*?<\/svg>\s*/gi,'');
    html=html.replace(/<metadata\b[^>]*>[\s\S]*?<\/metadata>\s*/gi,'');
    html=html.replace(/<footer\s+id=["']footer["']>[\s\S]*?<\/footer>/i,'');
    const protectionStart=html.indexOf('<script>(function(){var _0xSDLW=');
    if(protectionStart>=0){
      const appStart=html.indexOf('const sections =',protectionStart);
      if(appStart<0)throw new Error('Unable to isolate application bootstrap');
      html=html.slice(0,protectionStart)+'<scr'+'ipt>\n'+html.slice(appStart);
    }
    if(status)status.textContent='Applying System Design Lab identity…';
    html=html.replace(/<title>[\s\S]*?<\/title>/i,'<title>System Design Lab | Interactive System & Security Architecture Lab</title>');
    html=html.replace(/<meta\s+name=["']description["'][^>]*>/i,'<meta name="description" content="Interactive laboratory for System Design, Distributed Systems, Security Architecture, DevSecOps and cybersecurity simulations.">');
    html=html.replace(/<meta\s+name=["']author["'][^>]*>/i,'<meta name="author" content="Pedro Estoura">');
    html=html.replace(/<link\s+rel=["'](?:canonical|author|me)["'][^>]*>\s*/gi,'');
    html=html.replace(/<meta\s+property=["']og:(?:url|image)["'][^>]*>\s*/gi,'');
    html=html.replace(/<meta\s+name=["']twitter:image["'][^>]*>\s*/gi,'');
    html=html.replace(/<meta\s+property=["']og:title["'][^>]*>/i,'<meta property="og:title" content="System Design Lab">');
    html=html.replace(/<meta\s+property=["']og:description["'][^>]*>/i,'<meta property="og:description" content="Interactive System Design and Security Architecture Laboratory.">');
    html=html.replace(/<meta\s+name=["']twitter:title["'][^>]*>/i,'<meta name="twitter:title" content="System Design Lab">');
    html=html.replace(/<meta\s+name=["']twitter:description["'][^>]*>/i,'<meta name="twitter:description" content="Interactive System Design & Security Architecture Lab">');
    const ldJson='<scr'+'ipt type="application/ld+json">'+JSON.stringify({'@context':'https://schema.org','@type':'WebSite','name':'System Design Lab','author':{'@type':'Person','name':'Pedro Estoura','url':'https://github.com/pestoura'}})+'<'+'/scr'+'ipt>';
    html=html.replace(/<script\s+type=["']application\/ld\+json["']>[\s\S]*?<\/script>/i,ldJson);
    html=html.replace(/family=Poppins:wght@400;500;600;700;800/g,'family=Manrope:wght@400;500;600;700;800');
    html=html.replace(/(['"])Poppins\1,sans-serif/g,"'Manrope',sans-serif");
    html=html.replace(/(['"])Syne\1,sans-serif/g,"'Manrope',sans-serif");
    html=html.replace(/(['"])Space Mono\1,monospace/g,"'JetBrains Mono',monospace");
    html=html.replace(/font-family=["']Poppins["']/g,'font-family="Manrope"');
    html=html.replace(/font-family=["']Syne["']/g,'font-family="Manrope"');
    html=html.replace(/font-family=["']Space Mono["']/g,'font-family="JetBrains Mono"');
    palette.forEach(function(pair){html=html.replace(pair[0],pair[1]);});
    html=html.replace(/<div class=["']nav-logo-icon["']>[\s\S]*?<\/div>/i,'<div class="nav-logo-icon">SD</div>');
    html=html.replace(/<span>System Design<\/span>/i,'<span>System Design Lab</span>');
    html=html.replace(/<div style=["']margin-bottom:16px["']>\s*<span class=["']badge badge-cyan["']>[^<]*<\/span>\s*<span class=["']badge badge-amber["']>[^<]*<\/span>\s*<span class=["']badge badge-green["']>[^<]*<\/span>\s*<\/div>/i,'<div style="margin-bottom:16px"><span class="badge badge-cyan">SYSTEM DESIGN</span><span class="badge badge-amber">SECURITY ARCHITECTURE</span><span class="badge badge-green">INTERACTIVE LABS</span></div>');
    html=html.replace(/<div class=["']hero-title["']>[\s\S]*?<\/div>/i,'<div class="hero-title">Design Systems.<br>Engineer Security.</div>');
    html=html.replace(/<div class=["']hero-sub["']>[\s\S]*?<\/div>/i,'<div class="hero-sub">Interactive lab for system design, distributed architectures, resilience and security engineering.</div>');
    const securityCss='<link rel="stylesheet" href="./assets/security-lab.css?v=1">';
    const securityJs='<scr'+'ipt src="./assets/security-lab.js?v=1"><'+'/scr'+'ipt>';
    const securityBridge='<scr'+'ipt src="./assets/security-navigation-bridge.js?v=10"><'+'/scr'+'ipt>';
    html=html.replace(/<\/head>/i,securityCss+'\n</head>');
    const footer='<footer id="footer"><a href="https://github.com/pestoura" target="_blank" rel="noopener">© 2026 <strong>Pedro Estoura</strong> · System Design Lab</a></footer>';
    html=html.replace(/<\/body>/i,footer+'\n'+securityJs+'\n'+securityBridge+'\n</body>');
    if(/_0xSDLW|_SDL_AUTHOR/i.test(html))throw new Error('Legacy executable bootstrap was not fully removed');
    if(!html.includes('Pedro Estoura')||!html.includes('#FFB000')||!html.includes('#4EA1FF'))throw new Error('Identity transformation failed');
    if(status)status.textContent='Starting laboratory…';
    document.open();document.write(html);document.close();
  }catch(err){
    const boot=document.getElementById('boot');
    if(boot)boot.innerHTML='<div class="boot-card"><div class="boot-title">System Design <span class="boot-accent">Lab</span></div><div class="boot-sub">Unable to initialize the lab.<br><br><code>'+String(err.message||err)+'</code></div></div>';
    console.error('System Design Lab bootstrap error:',err);
  }
})();
</script>
</body>
</html>
